name: Build ShieldGuard Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          if [ -f "build.gradle.kts" ]; then
            gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ShieldGuard-debug.apk
          elif [ -f "shieldguard-android/build.gradle.kts" ]; then
            cd shieldguard-android && gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../ShieldGuard-debug.apk
          elif [ -f "android-app/build.gradle.kts" ]; then
            cd android-app && gradle assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../ShieldGuard-debug.apk
          else
            echo "Errore: build.gradle.kts non trovato"
            exit 1
          fi

      - name: Upload ShieldGuard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldGuard-Android-APK
          path: ShieldGuard-debug.apk
